<!doctype html>
<html lang="de" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark light" />
    <title>Portfolio</title>
    <meta name="description" content="" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="og.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>
  <body class="is-loading">
    <a class="skip-link" href="#work" data-i18n="skip"></a>

    <!-- ============ WebGL stage ============ -->
    <div class="stage" aria-hidden="true">
      <canvas id="gl"></canvas>
      <div class="stage__fallback"></div>
    </div>
    <div class="crt-overlay" aria-hidden="true"></div>

    <!-- ============ Preloader ============ -->
    <div class="preloader" role="status" aria-live="polite">
      <div class="preloader__inner">
        <div class="preloader__count"><span class="js-count">000</span><span class="preloader__pct">%</span></div>
        <div class="preloader__bar"><span class="js-bar"></span></div>
        <ol class="preloader__log js-log" aria-hidden="true"></ol>
      </div>
      <div class="preloader__beam" aria-hidden="true"></div>
    </div>

    <!-- ============ Header ============ -->
    <header class="header">
      <a class="header__logo js-name glitch-hover" href="#top" data-scroll-to="0"></a>
      <nav class="header__right" aria-label="Primär">
        <div class="lang js-lang" role="group" aria-label="Sprache"></div>
        <a class="header__link js-talk" href="#contact"><span data-i18n="letsTalk"></span><i class="dot dot--live" aria-hidden="true"></i></a>
        <button class="header__link header__menu js-menu-open" aria-expanded="false" aria-controls="menu">
          <span data-i18n="menu"></span>
          <svg width="12" height="10" viewBox="0 0 12 10" aria-hidden="true"><path d="M0 1h12M0 5h12M0 9h12" stroke="currentColor" stroke-width="1.2"/></svg>
        </button>
      </nav>
    </header>

    <!-- ============ Scroll content ============ -->
    <main id="top" class="scroller">
      <!-- HERO -->
      <section class="sec sec--hero" data-section="hero" data-theme="dark" style="--len: 220">
        <div class="sticky">
          <div class="hero">
            <div class="hero__left reveal">
              <h1 class="hero__name js-name rgb" data-text=""></h1>
              <div class="hero__meta">
                <span data-i18n="portfolio"></span>
                <span class="js-year-code"></span>
              </div>
            </div>
            <p class="hero__line reveal js-hero-line" data-i18n="heroLine"></p>
            <div class="hero__scroll reveal">
              <span data-i18n="scrollHint"></span>
              <span class="hero__scroll-bar"><i></i></span>
            </div>
            <div class="hero__coords mono" aria-hidden="true">
              <span class="js-coords">x 0.000 · y 0.000</span>
              <span class="js-fps">60 fps</span>
            </div>
          </div>
        </div>
      </section>

      <!-- WORK -->
      <section id="work" class="sec sec--work" data-section="work" data-theme="light">
        <div class="sticky">
          <div class="work">
            <div class="work__index">
              <h2 class="work__title rgb" data-i18n="selectedWork"></h2>
              <ol class="work__list js-work-list"></ol>
            </div>
            <article class="work__card js-work-card" aria-live="polite">
              <div class="work__card-head mono">
                <span><span data-i18n="project"></span> <b class="js-card-num">01</b> / <span class="js-card-total">04</span></span>
                <span class="js-card-year"></span>
              </div>
              <h3 class="work__card-title js-card-title"></h3>
              <dl>
                <dt data-i18n="info"></dt>
                <dd class="js-card-info"></dd>
                <dt data-i18n="role"></dt>
                <dd class="js-card-role"></dd>
              </dl>
              <button class="btn-bracket js-card-open"><span data-i18n="openProject"></span></button>
            </article>
            <div class="work__progress" aria-hidden="true"><i class="js-work-progress"></i></div>
          </div>
        </div>
      </section>

      <!-- ABOUT -->
      <section id="about" class="sec sec--about" data-section="about" data-theme="light" style="--len: 260">
        <div class="sticky">
          <div class="about">
            <div class="about__block reveal" data-step="0">
              <div class="about__icon" aria-hidden="true"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="18.5" fill="none" stroke="currentColor" stroke-dasharray="2 2"/><circle cx="14" cy="16" r="1.6" fill="currentColor"/><circle cx="26" cy="16" r="1.6" fill="currentColor"/><path d="M13 24c2.6 4 11.4 4 14 0" fill="none" stroke="currentColor" stroke-dasharray="2 2" stroke-linecap="round"/></svg></div>
              <p class="label mono" data-i18n="aboutLabel"></p>
              <h2 class="about__title" data-i18n="aboutTitle"></h2>
              <p class="about__text" data-i18n="aboutText"></p>
            </div>
            <div class="about__block reveal" data-step="1">
              <div class="about__icon" aria-hidden="true"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="18.5" fill="none" stroke="currentColor" stroke-dasharray="2 2"/><ellipse cx="20" cy="20" rx="8" ry="18.5" fill="none" stroke="currentColor" stroke-dasharray="2 2"/><path d="M2 20h36M5 11h30M5 29h30" stroke="currentColor" stroke-dasharray="2 2"/></svg></div>
              <p class="label mono" data-i18n="clientsLabel"></p>
              <h2 class="about__title" data-i18n="clientsTitle"></h2>
              <p class="about__text" data-i18n="clientsText"></p>
            </div>
            <div class="about__services reveal" data-step="2">
              <p class="label mono" data-i18n="servicesLabel"></p>
              <ul class="js-services"></ul>
            </div>
          </div>
        </div>
      </section>

      <!-- CONTACT -->
      <section id="contact" class="sec sec--contact" data-section="contact" data-theme="dark" style="--len: 200">
        <div class="sticky">
          <div class="contact">
            <p class="label mono" data-i18n="contactLabel"></p>
            <h2 class="contact__title js-contact-title rgb"></h2>
            <p class="contact__sub" data-i18n="contactSub"></p>
            <button class="cta js-form-open">
              <span class="cta__label" data-i18n="contactCta"></span>
              <span class="cta__arrow cta__arrow--l" aria-hidden="true">▶</span>
              <span class="cta__arrow cta__arrow--r" aria-hidden="true">◀</span>
              <span class="cta__arrow cta__arrow--b" aria-hidden="true">▲</span>
            </button>
            <p class="contact__mail mono"><span data-i18n="orEmail"></span> <a class="js-email glitch-hover" href="#"></a></p>
          </div>
          <footer class="footer">
            <ul class="footer__social js-socials"></ul>
            <button class="footer__back js-back mono"><span>&gt;</span> <span data-i18n="scrollBack"></span></button>
            <div class="footer__legal mono">
              <a href="impressum.html" data-i18n="imprint"></a>
              <a href="datenschutz.html" data-i18n="privacy"></a>
              <span><span class="js-name-plain"></span> <span data-i18n="rights"></span> © <span class="js-year"></span></span>
            </div>
          </footer>
        </div>
      </section>
    </main>

    <!-- ============ Menu ============ -->
    <div id="menu" class="menu" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Menü">
      <div class="menu__inner">
        <button class="menu__close js-menu-close mono"><span data-i18n="close"></span> – x</button>
        <ol class="menu__nav js-menu-nav"></ol>
        <ul class="menu__social js-menu-social mono"></ul>
        <div class="menu__foot mono">
          <a href="impressum.html" data-i18n="imprint"></a>
          <a href="datenschutz.html" data-i18n="privacy"></a>
          <span>© <span class="js-year"></span></span>
        </div>
      </div>
    </div>

    <!-- ============ Project overlay ============ -->
    <div class="project" aria-hidden="true" role="dialog" aria-modal="true">
      <div class="project__inner">
        <div class="project__top mono">
          <span><span data-i18n="project"></span> <b class="js-p-index">01</b> / <span class="js-p-count">04</span></span>
          <button class="js-p-close"><span data-i18n="close"></span> – x</button>
        </div>
        <div class="project__media">
          <button class="project__nav project__nav--prev js-p-prev" aria-label="Vorheriges Bild">&lt;</button>
          <div class="project__frame"><img class="js-p-img" alt="" /></div>
          <button class="project__nav project__nav--next js-p-next" aria-label="Nächstes Bild">&gt;</button>
          <div class="project__dots js-p-dots"></div>
        </div>
        <div class="project__info">
          <h2 class="project__title js-p-title rgb"></h2>
          <dl>
            <dt data-i18n="info"></dt>
            <dd class="js-p-info"></dd>
            <dt data-i18n="role"></dt>
            <dd class="js-p-role"></dd>
            <dt data-i18n="year"></dt>
            <dd class="js-p-year"></dd>
          </dl>
          <a class="btn-bracket js-p-visit" target="_blank" rel="noopener"><span data-i18n="visit"></span></a>
        </div>
      </div>
    </div>

    <!-- ============ Contact form ============ -->
    <div class="modal js-form-modal" aria-hidden="true" role="dialog" aria-modal="true">
      <form class="form js-form" novalidate>
        <div class="form__head mono">
          <span data-i18n="form.title"></span>
          <button type="button" class="js-form-close"><span data-i18n="close"></span> – x</button>
        </div>
        <label><span data-i18n="form.name"></span><input name="name" required autocomplete="name" /></label>
        <label><span data-i18n="form.email"></span><input name="email" type="email" required autocomplete="email" /></label>
        <label><span data-i18n="form.company"></span><input name="company" autocomplete="organization" /></label>
        <fieldset><legend data-i18n="form.budget"></legend><div class="form__chips js-budgets"></div></fieldset>
        <label><span data-i18n="form.message"></span><textarea name="message" rows="4" required></textarea></label>
        <button class="btn-bracket form__send" type="submit"><span data-i18n="form.send"></span></button>
        <p class="form__status mono js-form-status" role="status"></p>
      </form>
    </div>

    <!-- ============ Sensors consent (mobile) ============ -->
    <div class="sensors" aria-hidden="true">
      <p><span data-i18n="sensors.text"></span> <b data-i18n="sensors.strong"></b> <span data-i18n="sensors.text2"></span></p>
      <div><button class="js-sensors-allow" data-i18n="sensors.allow"></button><button class="js-sensors-decline" data-i18n="sensors.decline"></button></div>
    </div>

    <!-- ============ Cursor ============ -->
    <div class="cursor" aria-hidden="true"><i class="cursor__cross"></i><span class="cursor__label mono"></span></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
